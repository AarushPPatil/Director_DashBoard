<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Director DashBoard</title>
<style>
  /* ============================================================
     इथे तुमच्या दोन ऍप्लिकेशनच्या लिंक टाका (फक्त या दोन ओळी बदला)
     ============================================================ */
  :root{
    --bg:#f1f3f7; --surface:#ffffff; --ink:#1c2740; --muted:#5b6578; --line:#d9deea;
    --adm:#0f6b63; --adm-soft:#e3f2f0;
    --act:#a8480f; --act-soft:#fbeadd;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121826; --surface:#1b2336; --ink:#eef1f8; --muted:#a2abc0; --line:#2c3652;
      --adm:#5fd0c4; --adm-soft:#16342f;
      --act:#f2a56b; --act-soft:#3a2517;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans Devanagari","Mukta","Nirmala UI","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;
    display:flex;flex-direction:column;
  }
  header{padding:28px 6vw 8px}
  header h1{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:700;line-height:1.4}
  header p{color:var(--muted);margin-top:4px;font-size:1rem}
  main{
    flex:1;padding:24px 6vw 40px;
    display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    align-content:start;
  }
  .tile{
    display:flex;flex-direction:column;justify-content:space-between;gap:48px;
    text-decoration:none;color:inherit;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);
    border-left:10px solid var(--c);border-radius:6px;
    padding:32px 30px;min-height:260px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,30,60,.14)}
  .tile:focus-visible{outline:3px solid var(--c);outline-offset:3px}
  .tile.adm{--c:var(--adm);--soft:var(--adm-soft)}
  .tile.act{--c:var(--act);--soft:var(--act-soft)}
  .icon{
    width:64px;height:64px;border-radius:50%;background:var(--soft);
    display:grid;place-items:center;
  }
  .icon svg{width:32px;height:32px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tile h2{font-size:1.6rem;font-weight:700;margin-top:20px;line-height:1.35}
  .tile p{color:var(--muted);margin-top:6px;font-size:1rem}
  .open{
    align-self:flex-start;background:var(--c);color:#fff;font-weight:600;
    padding:10px 22px;border-radius:4px;font-size:1rem;
  }
  @media (prefers-color-scheme: dark){ .open{color:#10151f} }
  footer{padding:0 6vw 24px;color:var(--muted);font-size:.9rem}
  @media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>

<header>
  <h1 id="greet">Hello, Madam</h1>
  <p id="today"></p>
</header>

<main>
  <a class="tile adm" id="admLink" href="#" target="_blank" rel="noopener">
    <div>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/></svg>
      </div>
      <h2>Admission Management system</h2>
      <p>Admission application, student records and admission process</p>
    </div>
    <span class="open">Click</span>
  </a>

  <a class="tile act" id="actLink" href="#" target="_blank" rel="noopener">
    <div>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M9 15l2 2 4-4"/></svg>
      </div>
      <h2>Activity Management System</h2>
      <p>Management of activities, events and participation</p>
    </div>
    <span class="open">Click</span>
  </a>
</main>



<script>
  // ====== फक्त या दोन लिंक बदला ======
  const ADMISSION_URL = "http://localhost:8000/login";
  const ACTIVITY_URL  = "http://localhost:8080";
  // ====================================

  document.getElementById("admLink").href = ADMISSION_URL;
  document.getElementById("actLink").href = ACTIVITY_URL;

  const now = new Date();
  const h = now.getHours();
  const wish = h < 12 ? "Good Morning" : h < 17 ? "Good Afternoon" : "Good Evening";
  document.getElementById("greet").textContent = wish + ", मॅडम";
  document.getElementById("today").textContent =
    now.toLocaleDateString("mr-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
</script>
</body>
</html>
